{% extends "layout.html" %}
{% block title %}Not found · {{ app.branding.app_name }}{% endblock %}
{% block content %}
<main class="page width-slim"><section class="widget"><div class="widget-content">
  <p class="size-h3 color-highlight">No page called “{{ slug }}”.</p>
  <p class="color-subdue">Pages: {% for p in pages %}<a class="color-primary" href="{{ base_url }}/{{ p.slug }}">{{ p.name }}</a>{{ ", " if not loop.last }}{% endfor %}</p>
</div></section></main>
{% endblock %}
