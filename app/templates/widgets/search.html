<form class="search-box" data-search data-engine="{{ engine_url }}" data-bangs="{{ bangs | tojson | forceescape }}"
  {%- if o.new_tab %} data-new-tab{% endif %}{% if o.autofocus %} data-autofocus{% endif %} role="search">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
  <input type="text" name="q" autocomplete="off" spellcheck="false" placeholder="{{ o.placeholder }}" aria-label="Search">
  <span class="search-bang" hidden></span>
  <kbd class="search-hint" title="Press / or s to focus">/</kbd>
</form>
