<div data-calendar data-first-day="{{ first_day }}">
  <div class="cal-head">
    <div class="cal-title">&nbsp;</div>
    <div class="cal-nav">
      <button type="button" data-cal-prev aria-label="Previous month">‹</button>
      <button type="button" data-cal-today aria-label="This month">•</button>
      <button type="button" data-cal-next aria-label="Next month">›</button>
    </div>
  </div>
  <div class="cal-grid"></div>
</div>
