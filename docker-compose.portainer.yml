# Vantage as a Portainer stack, built from this Git repository.
#
# Portainer: Stacks -> Add stack -> Repository
#   Repository URL:  https://github.com/punxrus/vantage-docker-proxy
#   Reference:       refs/heads/master
#   Compose path:    docker-compose.portainer.yml
#   Environment variables: MYSPEED_PASSWORD, AGENT_TOKEN_10, FAMILY_CALENDAR_ID,
#                          GITHUB_TOKEN (optional)
#
# The image has no config inside it. Vantage reads it from the host, so first,
# over SSH on the ZimaBoard:
#   git clone https://github.com/punxrus/vantage-docker-proxy /DATA/AppData/vantage
#   sudo chown -R 1000:1000 /DATA/AppData/vantage/data
#
# Using the Web editor instead? Build first
# (docker build -t vantage:latest /DATA/AppData/vantage), delete the `build:` line
# below and change `pull_policy` to `never`.
services:
  vantage:
    build: .
    image: vantage:latest
    pull_policy: build     # never look for vantage:latest on Docker Hub
    container_name: vantage
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8281:8080"
    environment:
      - TZ=America/Los_Angeles
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MYSPEED_PASSWORD=${MYSPEED_PASSWORD}
      - AGENT_TOKEN_10=${AGENT_TOKEN_10}
      - FAMILY_CALENDAR_ID=${FAMILY_CALENDAR_ID}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - /DATA/AppData/vantage/config:/app/config
      - /DATA/AppData/vantage/assets:/app/assets
      - /DATA/AppData/vantage/data:/app/data
      - /proc:/host/proc:ro
      - /DATA:/host/data:ro
    depends_on:
      - docker-proxy

  # Read-only Docker API for the docker-containers widget (tcp://docker-proxy:2375).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: vantage-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
