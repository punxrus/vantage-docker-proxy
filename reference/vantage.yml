# Your six Glance pages recreated in Vantage syntax, as one file.
# Generated from config/ with: python -m app flatten > reference/vantage.yml
# The live config is config/vantage.yml + config/pages/*.yml (same content, split up).

server:
  timeout: 10s
  fetch-concurrency: 16
branding:
  app-name: Vantage
pages:
- name: Home
  columns:
  - size: small
    widgets:
    - type: myspeed
      url: http://192.168.0.10:5216
      password: ${MYSPEED_PASSWORD}
      limit: 3
    - type: search
      search-engine: google
      autofocus: false
      new-tab: true
    - type: todo
      id: home-todo
    - type: calendar
      first-day-of-week: sunday
    - type: custom-api
      title: Bruins Hockey
      title-url: https://www.nhl.com/bruins/schedule
      url: https://api-web.nhle.com/v1/club-schedule/BOS/week/now
      cache: 15m
      template: |
        <ul class="list list-gap-10">
          {% for g in json.games %}
          {% set home = g.homeTeam.abbrev == "BOS" %}
          <li>
            <div class="flex justify-between items-baseline">
              <span class="color-primary">{{ "vs " ~ g.awayTeam.abbrev if home else "@ " ~ g.homeTeam.abbrev }}</span>
              {% if g.gameState in ["FINAL", "OFF"] %}
                <span>{{ g.awayTeam.score }}-{{ g.homeTeam.score }} Final</span>
              {% elif g.gameState in ["LIVE", "CRIT"] %}
                <span class="color-primary">{{ g.awayTeam.score }}-{{ g.homeTeam.score }} LIVE</span>
              {% else %}
                <span class="color-text-subdue" {{ g.startTimeUTC | relative_time }}></span>
              {% endif %}
            </div>
            {% if g.gameState not in ["FINAL", "OFF", "LIVE", "CRIT"] %}
            <div class="size-h6 color-subdue">{{ g.startTimeUTC | format_time("%a %b %d, %I:%M %p") }}</div>
            {% endif %}
          </li>
          {% else %}
          <li class="color-subdue">No games this week.</li>
          {% endfor %}
        </ul>
    - type: rss
      title: Tech
      limit: 10
      collapse-after: 3
      cache: 3h
      feeds:
      - url: https://www.wired.com/feed/category/science/latest/rss
        title: Wired Science
        limit: 4
      - url: https://boingboing.net/feed
        title: Boing Boing
        limit: 4
      - url: https://www.geeky-gadgets.com/feed/
        title: Geeky Gadgets
        limit: 4
  - size: full
    widgets:
    - type: hacker-news
    - type: videos
      channels:
      - UCXJ4jKAvMMg56WGhqrZHFgw
      - UChqUTb7kYRX8-EiaN3XFrSQ
      - UCNye-wNBqNL5ZzHSJj3l8Bg
    - type: rss
      title: News
      limit: 8
      collapse-after: 3
      cache: 3h
      feeds:
      - url: https://www.huffpost.com/section/world-news/feed
        title: HuffPost World
        limit: 5
      - url: https://www.cnbc.com/id/100003114/device/rss/rss.html
        title: CNBC
        limit: 5
    - type: rss
      title: Food Wishes
      limit: 8
      collapse-after: 3
      cache: 6h
      feeds:
      - url: http://feeds.feedburner.com/blogspot/sBff
        title: Food Wishes
  - size: small
    widgets:
    - type: weather
      location: Allyn, United States
      units: imperial
    - type: markets
      markets:
      - symbol: GC=F
        name: Gold
      - symbol: SI=F
        name: Silver
      - symbol: EURUSD=X
        name: EUR/USD
      - symbol: USDCNY=X
        name: USD/CNY
    - type: monitor
      title: Services
      refresh: 1m
      sites:
      - title: Plex
        url: http://192.168.0.5:32400/web/index.html
        check-url: http://192.168.0.5:32400/identity
        icon: si:plex
      - title: Karakeep
        url: http://192.168.0.5:14592
        icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Karakeep/icon.png
      - title: Audiobookshelf
        url: http://192.168.0.5:13378
        icon: si:audiobookshelf
      - title: Obsidian
        url: https://192.168.0.5:15324
        icon: si:obsidian
        allow-insecure: true
      - title: Home Assistant
        url: http://192.168.0.5:8123
        icon: si:homeassistant
      - title: IT Tools
        url: http://192.168.0.5:8080
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/it-tools.png
      - title: Excalidraw
        url: http://192.168.0.10:17638
        icon: si:excalidraw
      - title: MySpeed
        url: http://192.168.0.10:5216
        icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/MySpeed/icon.png
- name: Horror
  columns:
  - size: full
    widgets:
    - type: videos
      title: Horror Movie Trailers
      channels:
      - UCY9k2Cesds_dF_ekz5c-gmQ
      - UCd1cLnwL83Xh-zAq5yGc7qw
    - type: rss
      title: Blumhouse
      limit: 10
      collapse-after: 4
      cache: 3h
      feeds:
      - url: https://bloody-disgusting.com/tag/blumhouse/feed/
        title: Bloody Disgusting - Blumhouse
        headers:
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
    - type: rss
      title: A24 Horror
      limit: 10
      collapse-after: 4
      cache: 3h
      feeds:
      - url: https://bloody-disgusting.com/tag/a24/feed/
        title: Bloody Disgusting - A24
        headers:
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
    - type: rss
      title: Horror News
      limit: 15
      collapse-after: 4
      cache: 1h
      feeds:
      - url: https://bloody-disgusting.com/feed/
        title: Bloody Disgusting
        limit: 8
        headers:
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
      - url: https://www.dreadcentral.com/feed/
        title: Dread Central
        limit: 8
- name: Family
  columns:
  - size: full
    widgets:
    - type: iframe
      title: Family Calendar
      source: https://calendar.google.com/calendar/embed?height=650&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showTabs=0&showCalendars=0&showTz=0&mode=MONTH&src=${FAMILY_CALENDAR_ID}%40group.calendar.google.com&color=%23039BE5
      height: 650
- name: Links
  columns:
  - size: full
    widgets:
    - type: bookmarks
      groups:
      - title: Self-Hosted
        color: 220 30 50
        links:
        - title: Plex
          url: http://192.168.0.5:32400/web/index.html
          icon: si:plex
        - title: Karakeep
          url: http://192.168.0.5:14592/
          icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Karakeep/icon.png
        - title: Obsidian
          url: https://192.168.0.5:15324/
          icon: si:obsidian
        - title: Audiobookshelf
          url: http://192.168.0.5:13378/
          icon: si:audiobookshelf
        - title: IT Tools
          url: http://192.168.0.5:8080/
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/it-tools.png
        - title: Excalidraw
          url: http://192.168.0.10:17638/
          icon: si:excalidraw
        - title: MySpeed
          url: http://192.168.0.10:5216/
          icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/MySpeed/icon.png
      - title: Web
        color: 100 40 50
        links:
        - title: Pluralsight
          url: https://app.pluralsight.com/
          icon: si:pluralsight
        - title: YouTube
          url: https://www.youtube.com/
          icon: si:youtube
        - title: AllRecipes
          url: https://www.allrecipes.com/
          icon: mdi:silverware-spoon
- name: Infra
  columns:
  - size: full
    widgets:
    - type: server-stats
      refresh: 30s
      servers:
      - type: local
        name: Host .5 (ZimaOS)
        mountpoints:
          /:
            name: System
          /host/data:
            name: DATA
      - type: remote
        name: Host .10
        url: http://192.168.0.10:27973
        token: ${AGENT_TOKEN_10}
    - type: docker-containers
      title: Docker — .5
      sock-path: tcp://docker-proxy:2375
      hide-by-default: false
      refresh: 1m
    - type: docker-containers
      title: Docker — .10
      sock-path: tcp://192.168.0.10:2375
      hide-by-default: false
      refresh: 1m
- name: Local
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Tides — Allyn, WA
      title-url: https://tidesandcurrents.noaa.gov/noaatidepredictions.html?id=9446281
      cache: 1h
      url: https://api.tidesandcurrents.noaa.gov/api/prod/datagetter
      parameters:
        product: predictions
        application: vantage_dashboard
        begin_date: '{{ now().strftime(''%Y%m%d'') }}'
        range: 48
        datum: MLLW
        station: 9446281
        time_zone: lst_ldt
        units: english
        interval: hilo
        format: json
      template: |
        {% if json.error %}
        <p class="color-negative">NOAA: {{ json.error.message }}</p>
        {% else %}
        <ul class="list list-gap-10">
          {% for p in json.predictions if (p.t | parse_time("%Y-%m-%d %H:%M") | epoch) > now().timestamp() - 3600 %}
          <li>
            <div class="flex justify-between items-baseline">
              <span class="color-primary">{{ "High Tide" if p.type == "H" else "Low Tide" }} — {{ "%.1f" | format(p.v | float) }} ft</span>
              <span class="color-text-subdue">
                <span {{ p.t | parse_time("%Y-%m-%d %H:%M") | relative_time }}></span>
                · {{ p.t | parse_time("%Y-%m-%d %H:%M") | format_time("%a %I:%M %p") }}
              </span>
            </div>
          </li>
          {% endfor %}
        </ul>
        {% endif %}
    - type: iframe
      title: Bremerton → Seattle Ferry Schedule
      source: https://wsdot.com/ferries/schedule/ScheduleDetail.aspx?arrivingterm=7&departingterm=4
      height: 700
